steps:
  - name: prettier
    image: node:24.12.0-alpine3.22
    commands:
      - apk add make
      - npm ci
      - make npm prettier-test
      - make sha
      - make typecheck
      - make test-ui

  - name: lint
    image: golangci/golangci-lint:v2.8.0
    commands:
      - make lint

  - name: test
    image: golang:1.25.10-trixie
    environment:
      CGO_ENABLED: "0"
    commands:
      - >-
        sed -i 's/^Components: main$/Components: main non-free/' /etc/apt/sources.list.d/debian.sources
      - apt-get update
      - apt-get install -y --no-install-recommends make git ca-certificates libimage-exiftool-perl ffmpeg libvips-tools mesa-va-drivers vainfo
      - if [ "$(dpkg --print-architecture)" = "amd64" ]; then apt-get install -y --no-install-recommends intel-media-va-driver-non-free i965-va-driver; fi
      - make test
    depends_on:
      - prettier

  - name: build
    image: golang:1.25.10-alpine3.23
    commands:
      - apk add make build-base git
      - make build
    depends_on:
      - prettier

  - name: build-assets
    image: node:24.12.0-alpine3.22
    commands:
      - apk add make
      - npm ci
      - make assets
    depends_on:
      - prettier

when:
  event:
    - push
